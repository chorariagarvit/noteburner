name: Database backup

# A nightly export of the production database, encrypted before it is stored.
# The repository is public and workflow artifacts can be downloaded by anyone who can read it, so an unencrypted
# export (it holds e-mail addresses and password hashes) must never be uploaded. See docs/DISASTER_RECOVERY.md.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Export and encrypt the D1 database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the three secrets exist
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Backup skipped: set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and BACKUP_PASSPHRASE (see docs/DISASTER_RECOVERY.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: '24'

      - name: Export, check and encrypt
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%d)"
          npx --yes wrangler@4 d1 export noteburner-db --remote --output "noteburner-$stamp.sql"
          # An export with no messages table means something went wrong: fail instead of storing an empty backup
          grep -q 'CREATE TABLE.*messages' "noteburner-$stamp.sql"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:BACKUP_PASSPHRASE \
            -in "noteburner-$stamp.sql" -out "noteburner-$stamp.sql.enc"
          rm "noteburner-$stamp.sql"
          ls -l

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: noteburner-d1-backup
          path: noteburner-*.sql.enc
          retention-days: 30
          if-no-files-found: error
