name = "noteburner-api"
main = "src/index.js"
compatibility_date = "2025-11-17"
compatibility_flags = [
  "nodejs_compat_v2"
]

# Enable logs
observability = { enabled = true }

# Routes for production deployment
routes = [
  { pattern = "noteburner.work/api/*", zone_name = "noteburner.work" },
  { pattern = "api.noteburner.work/*", zone_name = "noteburner.work" }
]

# D1 Database binding
[[ d1_databases ]]
binding = "DB"
database_name = "noteburner-db"
database_id = "aa64ae0a-1bbe-4916-b083-b8e027b53148" # Add your database ID after running: wrangler d1 create noteburner-db

# R2 Storage binding for media files
[[ r2_buckets ]]
binding = "MEDIA_BUCKET"
bucket_name = "noteburner-media"

# KV Namespace for caching (Week 12 - Performance optimization)
[[ kv_namespaces ]]
binding = "CACHE"
id = "b9797c1d6b9547eb8e42b2a9ac0c3ad8"
preview_id = "6042dca04d5f4fb09e37ca89ec9e37ed"

# Durable Object for exact (atomic) rate limiting. SQLite-backed classes work on the Workers Free plan.
[[ durable_objects.bindings ]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[ migrations ]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Email Worker binding (Cloudflare Email Routing)
# Run: wrangler types --env-interface CloudflareBindings
[[ send_email ]]
name = "EMAIL_SENDER"

# Environment variables
[vars]
FRONTEND_URL = "https://noteburner.work"
EMAIL_FROM = "hello@noteburner.work"  # Sender email address (use hello@/team@/support@ for better deliverability)
DEFAULT_EXPIRY_HOURS = "24"  # Default expiration time in hours
MAX_MESSAGE_SIZE = "10485760"  # 10MB
MAX_FILE_SIZE = "2147483648"   # 2GB (uses chunked uploads for files >100MB)
RATE_LIMIT_REQUESTS = "10"
RATE_LIMIT_WINDOW = "60"       # seconds
ENVIRONMENT = "production"     # the top-level config IS production; `npm run dev` overrides it with --var ENVIRONMENT:development

# Scheduled cleanup job (runs every hour)
[triggers]
crons = ["0 * * * *"]

# There are deliberately NO [env.*] blocks. Wrangler does not inherit bindings (D1, KV, R2, Durable
# Objects, routes, cron) into environments, so a separate "production" environment silently deploys a
# Worker without them. Deploy with plain `wrangler deploy` / `npm run deploy` and manage secrets without --env.
#
# Secrets (wrangler secret put <NAME>):
#   APP_TOKEN_SECRET     REQUIRED: the API refuses anonymous traffic without it (`openssl rand -hex 32`)
#   TOTP_ENCRYPTION_KEY  encrypts 2FA secrets at rest (`openssl rand -hex 32`); set once, never change
#   STRIPE_WEBHOOK_SECRET        only for the billing webhook
#   SLACK_SIGNING_SECRET         only if using the Slack integration
#   TURNSTILE_SECRET_KEY         OPTIONAL human check on the anonymous token endpoint; also add the widget's
#                                PUBLIC key as a var above:  TURNSTILE_SITE_KEY = "0x4AAAAAA..."
# The Durable Object RATE_LIMITER needs no secret; its migration is applied by `wrangler deploy`.
